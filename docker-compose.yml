services:
  postgres:
    image: postgres:16-alpine
    container_name: restroos-postgres
    environment:
      POSTGRES_USER: restroos_owner
      POSTGRES_PASSWORD: restroos_owner_dev_password
      POSTGRES_DB: restroos
    ports:
      - "5432:5432"
    volumes:
      - restroos_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restroos_owner -d restroos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  restroos_pgdata:
