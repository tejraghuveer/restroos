name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Tests (SQLite)
        run: pytest -q

  postgres-rls:
    name: PostgreSQL RLS isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: restroos_owner
          POSTGRES_PASSWORD: restroos_owner_dev_password
          POSTGRES_DB: restroos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restroos_owner -d restroos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Use the IPv4 loopback explicitly: "localhost" can resolve to ::1 first,
      # where the service container is not always reachable.
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: restroos_owner
      PGPASSWORD: restroos_owner_dev_password
      PGDATABASE: restroos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements-dev.txt

      - name: Check psql connectivity
        run: |
          psql --version
          psql -v ON_ERROR_STOP=1 -c '\conninfo'
          psql -v ON_ERROR_STOP=1 -c 'select version();'

      - name: Create low-privilege runtime role
        run: psql -v ON_ERROR_STOP=1 --echo-errors -f infra/postgres/init.sql

      - name: Apply migrations as schema owner
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://restroos_owner:restroos_owner_dev_password@127.0.0.1:5432/restroos
        run: alembic upgrade head

      - name: Harden runtime role
        run: psql -v ON_ERROR_STOP=1 --echo-errors -f infra/postgres/harden.sql

      - name: Run RLS isolation tests as the runtime role
        working-directory: apps/api
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://restroos_app:restroos_app_dev_password@127.0.0.1:5432/restroos
        run: pytest tests/isolation/test_postgres_rls.py -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build
