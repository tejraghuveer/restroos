[project]
name = "restroos-api"
version = "0.1.0"
description = "RestroOS multi-tenant restaurant management API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008"]  # assert in tests; FastAPI Depends defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.coverage.run]
source = ["app"]
omit = ["app/modules/*/models.py"]
